name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pydantic numpy opencv-python-headless scikit-learn duckdb pandas groq
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check schemas.py vision_ops.py run_pipeline.py database_ops.py init_db.py ui_helpers.py tests/

      - name: Pytest
        run: pytest tests/ -v --tb=short
